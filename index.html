<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="skins.css" />
  <link rel="stylesheet" href="pause-menu.css" />
  <link rel="stylesheet" href="scores.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section theme-toggle-section">
          <span class="label">LIGHT</span>
          <label class="theme-switch">
            <input type="checkbox" id="theme-toggle" aria-label="Cambiar entre tema oscuro y claro" />
            <span class="theme-switch-slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">SKIN</span>
          <select id="skin-select" aria-label="Elegir tema visual">
            <option value="retro">Retro</option>
            <option value="neon">Neon</option>
            <option value="pastel">Pastel</option>
            <option value="pixel">Pixel art</option>
          </select>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">RECORDS</span>
          <div id="side-records" class="records-container"></div>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="score-entry" class="score-entry hidden"></div>
        <div id="overlay-records" class="records-container"></div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden">
      <div class="overlay-box">
        <p id="pause-title">PAUSA</p>

        <div class="panel-section">
          <span class="label">NIVEL INICIAL</span>
          <select id="start-level-select">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
          </select>
        </div>

        <div class="pause-menu-actions">
          <button id="resume-btn">Reanudar</button>
          <button id="pause-restart-btn">Reiniciar</button>
          <button id="toggle-controls-btn">Ver controles</button>
        </div>

        <div id="pause-controls" class="panel-section controls hidden">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd>/<kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box start-box">
        <h2 class="start-title">TETRIS</h2>
        <div id="start-records" class="records-container"></div>
        <div class="start-stats">
          <div class="panel-section">
            <span class="label">MEJOR COMBO</span>
            <span class="value" id="start-best-combo">0</span>
          </div>
          <div class="panel-section">
            <span class="label">MÁS LÍNEAS</span>
            <span class="value" id="start-max-lines">0</span>
          </div>
        </div>
        <button id="play-btn">JUGAR</button>
        <button id="reset-scores-btn" class="reset-btn">Reset records</button>
        <div id="reset-confirm" class="reset-confirm hidden">
          <span>¿Seguro?</span>
          <button id="reset-yes-btn">Sí</button>
          <button id="reset-no-btn">No</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="skins.js"></script>
  <script src="pause-menu.js"></script>
  <script src="scores.js"></script>
</body>
</html>
